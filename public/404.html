<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      ;(function () {
        try {
          var l = window.location
          var redirect = l.pathname + l.search + l.hash
          sessionStorage.setItem('portfolio_redirect', redirect)
        } catch (e) {}
        window.location.replace('/showcase-portfolio/')
      })()
    </script>
  </head>
  <body>
    <p style="text-align:center;padding:40px;font-family:sans-serif;color:#94a3b8">Redirecting… <a href="/showcase-portfolio/">click here</a> if not redirected.</p>
    <noscript>JavaScript is required. Please <a href="/showcase-portfolio/">go to homepage</a>.</noscript>
  </body>
</html>
<!-- NOTE: vite.config.js copies dist/index.html -> dist/404.html at build, so this redirect is only fallback for cached old 404 or if copy fails. New deploys serve SPA directly at /admin/login without redirect. -->
